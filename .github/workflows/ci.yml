name: CyberGuard CI

on:
  push:
    branches:
      - master
      - "research/**"
      - "feature/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyberguard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-and-static-checks:
    name: C++20 build and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional live-capture test dependency
        run: python -m pip install -r requirements-live.txt

      - name: Configure CMake
        run: cmake -S . -B build -DCYBERGUARD_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run C++ tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate Python backend syntax
        run: python -m py_compile backend/incidents.py backend/server.py backend/simulation_bridge.py backend/live_monitor.py

      - name: Run Python backend tests
        run: python -m unittest discover -s backend/tests -v

      - name: Validate dashboard JavaScript syntax
        run: node --check app.js

      - name: Run C++ to SQLite integration
        run: python backend/run_simulation.py
        env:
          CYBERGUARD_DATA_DIR: ${{ runner.temp }}/cyberguard-integration-data
